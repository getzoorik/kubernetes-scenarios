apiVersion: v1
kind: Service
metadata:
  name: quorum
  namespace: quorum-statefulset
spec:
  clusterIP: None
  selector:
    app: quorum
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quorum
  namespace: quorum-statefulset
spec:
  serviceName: quorum
  replicas: 3
  selector:
    matchLabels:
      app: quorum
  template:
    metadata:
      labels:
        app: quorum
    spec:
      containers:
        - name: member
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["/bin/sh", "-c"]
          args:
            - |
              trap 'exit 0' TERM
              [ -f /data/id ] || hostname > /data/id
              httpd -p 8080 -h /data
              while true; do sleep 3600 & wait $!; done
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /id
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quorum
  namespace: quorum-statefulset
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: quorum
