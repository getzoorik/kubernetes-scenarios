apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: over-requested-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["/bin/sh", "-c"]
          args:
            - |
              trap 'exit 0' TERM
              mkdir -p /www
              echo ok > /www/index.html
              httpd -p 8080 -h /www
              while true; do
                read -r up _ < /proc/uptime
                stop=$(( ${up%.*}${up#*.} + 10 ))
                now=0
                while [ "$now" -lt "$stop" ]; do
                  read -r up _ < /proc/uptime
                  now=${up%.*}${up#*.}
                done
                usleep 900000
              done
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: over-requested-web-app
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
