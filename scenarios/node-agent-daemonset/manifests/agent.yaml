apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: node-agent-daemonset
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["/bin/sh", "-c"]
          args:
            - |
              trap 'exit 0' TERM
              while true; do
                cat /proc/loadavg
                sleep 10 & wait $!
              done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
