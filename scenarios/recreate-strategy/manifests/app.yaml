apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: recreate-strategy
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["/bin/sh", "-c"]
          args:
            - |
              trap 'exit 0' TERM
              mkdir -p /www
              echo ok > /www/index.html
              httpd -p 8080 -h /www
              while true; do sleep 3600 & wait $!; done
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: recreate-strategy
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 80
      targetPort: http
